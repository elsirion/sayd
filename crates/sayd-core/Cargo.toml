[package]
name = "sayd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Engine for the sayd speech daemon: queue, chunking, text cleanup, config"
readme = "README.md"
keywords = ["tts", "speech", "queue", "text-processing"]
categories = ["multimedia::audio", "accessibility"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
