[package]
name = "sayd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local text-to-speech daemon for Wayland: speaks the selection on a keybind"
readme = "README.md"
keywords = ["tts", "speech", "wayland", "sway", "daemon"]
categories = ["multimedia::audio", "accessibility", "command-line-utilities"]

[dependencies]
sayd-core.workspace = true
sayd-kokoro.workspace = true
sayd-g2p.workspace = true
cpal = "0.18"
rtrb = "0.3"
libc = "0.2"
# No features on purpose. `dlopen` (and `native_lib`) route the Wayland
# connection through libwayland-client via FFI, which then has to be found at
# runtime -- on NixOS it is not on the loader path, so the daemon fails to
# reach the compositor on a machine whose compositor is running fine. Featureless,
# wayland-backend speaks the wire protocol from Rust and needs no C library at all.
wl-clipboard-rs = { version = "0.9", default-features = false }
zbus = { version = "5", default-features = false, features = ["tokio"] }
# `sync` is named for `tokio::sync::Semaphore`, which bounds rewrites in
# flight. It is already switched on transitively by zbus and mpris-server, so
# naming it adds no code -- but a bound this file's safety argument rests on
# must not depend on another crate's feature list staying as it is today.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
ksni = "0.3"
mpris-server = { version = "0.10", features = ["tokio"] }
# Config file watching. Its only default feature selects a macOS backend,
# and this daemon is Wayland-only; on Linux the inotify backend is compiled
# in unconditionally, so no feature buys anything here.
notify = { version = "8", default-features = false }
gtk4 = "0.11.4"
# `v1_4` is what makes `SpinRow`/`SwitchRow` (and, transitively, `EntryRow`)
# exist at all: libadwaita's bindings have no `default` feature, so every type
# newer than 1.0 is compiled out unless a version feature asks for it. Pinned
# at `v1_4` rather than the newest available on purpose -- `v1_6` marks
# `PreferencesWindow` and its `add`/`add_toast` deprecated in favour of
# `PreferencesDialog`, which must be presented against a parent widget this
# daemon does not have (it has no application window at all, only a tray
# icon). The system libadwaita here is 1.9.3, comfortably above 1.4.
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"] }
# glib is a direct dependency of gtk4 already, but must be named here to use
# `glib::MainContext`/`MainLoop`/`idle_add_once` directly in `main`.
glib = "0.22"
# glib 0.22 has no `MainContext::channel` (removed in favour of plain async
# channels driven by `spawn_local`); this is what wakes the main thread for
# a settings request. Already in Cargo.lock at 2.5.0 as a transitive
# dependency of other crates, so naming it directly adds no new code.
async-channel = "2"
# The rewording client (`--features reword`). Measured at 16 crates new to
# sayd at exactly this configuration (`cargo tree -e normal`, 160 -> 176);
# default features add gzip and five more, and any TLS backend but `rustls`
# drags in `aws-lc-sys`, which needs `cmake` -- not in this project's
# devshell. `rustls` here means `ring`, which needs a C compiler and nothing
# else. Cargo.lock grows by more than 16 because it is feature-agnostic and
# records ureq's optional dependencies too; those are not built.
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"], optional = true }
# Both already in Cargo.lock (sayd-core and zbus build them), so naming them
# here adds no new code. Named rather than inherited because `http.rs`
# derives Serialize/Deserialize and calls serde_json directly.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
models = []
# Off by default, and the justification is not weight -- at 15 crates that
# would not carry it. The README promises "no network access at runtime,
# nothing leaves your machine", and a default build with no HTTP client and
# no TLS in it makes that a property of the *binary* rather than a property
# of the configuration. `enabled = false` is a promise sayd keeps;
# `--features reword` left off is a promise the compiler keeps.
reword = ["dep:ureq", "dep:serde", "dep:serde_json"]
