[package]
name = "sayd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local text-to-speech daemon for Wayland: speaks the selection on a keybind"
readme = "README.md"
keywords = ["tts", "speech", "wayland", "sway", "daemon"]
categories = ["multimedia::audio", "accessibility", "command-line-utilities"]

[dependencies]
sayd-core.workspace = true
sayd-kokoro.workspace = true
sayd-g2p.workspace = true
cpal = "0.18"
rtrb = "0.3"
libc = "0.2"
# No features on purpose. `dlopen` (and `native_lib`) route the Wayland
# connection through libwayland-client via FFI, which then has to be found at
# runtime -- on NixOS it is not on the loader path, so the daemon fails to
# reach the compositor on a machine whose compositor is running fine. Featureless,
# wayland-backend speaks the wire protocol from Rust and needs no C library at all.
wl-clipboard-rs = { version = "0.9", default-features = false }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
ksni = "0.3"
mpris-server = { version = "0.10", features = ["tokio"] }
# Config file watching. Its only default feature selects a macOS backend,
# and this daemon is Wayland-only; on Linux the inotify backend is compiled
# in unconditionally, so no feature buys anything here.
notify = { version = "8", default-features = false }

[dev-dependencies]
tempfile = "3"

[features]
models = []
